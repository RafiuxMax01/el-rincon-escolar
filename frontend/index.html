<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>El Rincón Escolar - Inventario</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>El Rincón Escolar</h1>
    <p>Inventario de productos</p>
  </header>

  <main>
    <section>
      <h2>Productos disponibles</h2>

      <div id="inventario">
        Cargando productos...
      </div>
    </section>

    <section>
  <h2>Registrar venta</h2>

  <form id="form-venta">
    <label for="producto-select">Producto</label>
    <select id="producto-select" required>
      <option value="">Selecciona un producto</option>
    </select>

    <label for="cantidad-input">Cantidad</label>
    <input type="number" id="cantidad-input" min="1" required>

    <button type="submit">Registrar venta</button>
  </form>

  <p id="mensaje-venta"></p>
</section>
  </main>

  <script src="app.js"></script>

</body>
</html>
